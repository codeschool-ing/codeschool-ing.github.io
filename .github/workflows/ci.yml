# Continuous integration.
#
# NOT aleogr/pipeline. The organisation's shared workflows are Go — ci-go.yml,
# cd-go.yml and eight composite actions, all named for it — and there is no Go
# here. Calling them would mean lint, test and build jobs with nothing to lint,
# test or build. What this repository has instead is three tools of its own, and
# what CI can usefully do is run them on every pull request rather than trusting
# that somebody read the list in CLAUDE.md before pushing.
#
# There is no build step to guard: Pages serves the default branch as it is. So
# these are checks, and every one of them is a rule the catalogue or the
# dictionaries can break in a way nobody sees by reading a diff.

name: Continuous Integration

# Also on main, and that is not symmetry for its own sake: the bundle this
# builds is uploaded as an artefact, so every commit on main leaves a
# downloadable showcase.html behind. Getting the current single file stops being
# something anyone has to ask a person for.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'

      # A prerequisite naming a course that does not exist, a cycle, or a track
      # listing a course before the one it depends on. None of the three is
      # visible in a diff, and all three break the graph the site draws.
      - name: The catalogue holds together
        run: node tools/validate-catalog/validate-catalog.js

      # A missing key is not an error at runtime — the field falls back to English,
      # the page renders and nothing throws. That is right for a half-finished
      # translation and wrong for a mistake, so it has to be a check. It exists
      # because a fork's label fell back to English in four languages and shipped.
      - name: The four dictionaries match the catalogue
        run: node tools/validate-i18n/validate-i18n.js

      - name: The version is readable, and is a version
        run: |
          set -euo pipefail
          v="$(node tools/version/version.js --check)"
          echo "version: $v"
          case "$v" in
            dev|[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the version is neither a semantic version nor \"dev\""; exit 1 ;;
          esac

      # The single file is what gets opened off a disk, and it is produced by a
      # script that resolves every asset by hand. A bundle that stopped building
      # is a deliverable nobody has until someone tries to send it.
      - name: The single-file bundle still builds
        run: python3 tools/bundle/bundle.py

      # The point of keeping it. On a pull request it is the change, openable
      # before merging; on main it is the current site in one file. 30 days,
      # because a tagged release keeps its own copy for good and this one only
      # has to outlive the reason somebody wanted it.
      - name: Keep the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-html
          path: showcase.html
          retention-days: 30

  # Its own job because it is the only thing here that needs a dependency: a real
  # browser, to lay the graph out and measure where the curves actually went. The
  # checks above stay dependency-free and finish in seconds; this one takes a
  # minute to install Chromium and should not hold them up.
  Graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # An edge passing through a card it has nothing to do with is invisible in a
      # diff and obvious on the screen. The README claimed this was verified; until
      # this job existed, nothing verified it.
      - name: No edge crosses a card
        run: node tools/graph-test/graph-test.js
